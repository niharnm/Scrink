packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 reads workspace policy from this file instead of package.json.
# Keep these aligned with the root pnpm.overrides block for pnpm 9 clients.
overrides:
  postcss: "8.5.22"
  undici: ">=7.28.0 <8"
  hono: "4.12.31"
  "@hono/node-server": ">=2.0.5 <3"
  axios: ">=1.18.0 <2"
  body-parser: ">=2.3.0 <3"
  fast-uri: ">=3.1.4 <4"
  form-data: ">=4.0.6 <5"
  qs: ">=6.15.2 <7"
  esbuild: ">=0.28.1 <0.29"
  js-yaml: ">=4.2.0 <5"
  sharp: ">=0.35.0 <0.36"

# pnpm 11 blocks dependency lifecycle scripts unless they are reviewed here.
# These are the pinned native/code-generation dependencies already used by the
# existing Next.js toolchain.
allowBuilds:
  esbuild: true
  sharp: true
  tldjs: true
  unrs-resolver: true
