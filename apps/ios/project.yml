name: Rinkler
options:
  bundleIdPrefix: com.rinkler.app
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  Tun2SocksKit:
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    exactVersion: "5.14.4"

targets:
  Rinkler:
    type: application
    platform: iOS
    sources:
      - path: Rinkler
    dependencies:
      - target: RinklerTunnel
      - target: RinklerActivityReport
      - sdk: NetworkExtension.framework
      - sdk: DeviceActivity.framework
    info:
      path: Rinkler/Info.plist
      properties:
        CFBundleDisplayName: Rinkler
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - SK Pupok Solid 400.ttf
          - Coolvetica Rg.otf
          - Coolvetica Rg It.otf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Rinkler reads heart-rate variability, resting heart rate, and activity (Move, steps, exercise) on your device to spot stress and low-movement moments and tighten your limits automatically. This data never leaves your phone."
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_KEY: $(SUPABASE_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.rinkler.app.oauth
            CFBundleURLSchemes:
              - rinkler
    entitlements:
      path: Rinkler/Rinkler.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.rinkler.app
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rinkler.app
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: Rinkler/Info.plist
        DEVELOPMENT_TEAM: QDKSUX27F9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  RinklerTunnel:
    type: app-extension
    platform: iOS
    sources:
      - RinklerTunnel
    dependencies:
      - package: Tun2SocksKit
      - sdk: NetworkExtension.framework
    info:
      path: RinklerTunnel/Info.plist
      properties:
        CFBundleDisplayName: Rinkler Tunnel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: RinklerTunnel/RinklerTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.rinkler.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rinkler.app.tunnel
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: QDKSUX27F9

  RinklerActivityReport:
    type: app-extension
    platform: iOS
    sources:
      - RinklerActivityReport
    dependencies:
      - sdk: DeviceActivity.framework
    info:
      path: RinklerActivityReport/Info.plist
      properties:
        CFBundleDisplayName: Rinkler Usage
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: RinklerActivityReport/RinklerActivityReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.rinkler.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rinkler.app.activityreport
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: QDKSUX27F9
        INFOPLIST_FILE: RinklerActivityReport/Info.plist
