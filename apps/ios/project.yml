name: Rinkler
options:
  bundleIdPrefix: com.rinkler.app
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

packages:
  Tun2SocksKit:
    url: https://github.com/EbrahimTahernejad/Tun2SocksKit
    exactVersion: "5.14.4"

targets:
  Rinkler:
    type: application
    platform: iOS
    sources:
      - path: Rinkler
    dependencies:
      - target: RinklerTunnel
      - sdk: NetworkExtension.framework
    info:
      path: Rinkler/Info.plist
      properties:
        UIAppFonts:
          - SK Pupok Solid 400.ttf
          - Coolvetica Rg.otf
          - Coolvetica Rg It.otf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_KEY: $(SUPABASE_KEY)
    entitlements:
      path: Rinkler/Rinkler.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rinkler.app
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: Rinkler/Info.plist
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  RinklerTunnel:
    type: app-extension
    platform: iOS
    sources:
      - RinklerTunnel
    dependencies:
      - package: Tun2SocksKit
      - sdk: NetworkExtension.framework
    info:
      path: RinklerTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: RinklerTunnel/RinklerTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rinkler.app.tunnel
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: ""
